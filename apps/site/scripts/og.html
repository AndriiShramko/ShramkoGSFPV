<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JBM"; src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #07080a; color: #e8eaed; font-family: "Inter", sans-serif; position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(232,234,237,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(232,234,237,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(48% 70% at 82% 45%, #000 0%, transparent 78%); mask-image: radial-gradient(48% 70% at 82% 45%, #000 0%, transparent 78%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(40% 55% at 82% 45%, rgba(74,222,128,.10), transparent 70%); }
  .content { position: absolute; left: 72px; top: 72px; right: 440px; bottom: 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
  h1 { margin: 56px 0 0; font-size: 62px; line-height: 1.04; font-weight: 650; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #4ade80; }
  .foot { margin-top: auto; font-family: "JBM", monospace; font-size: 20px; color: #9ba3ae; letter-spacing: .02em; display: flex; gap: 22px; }
  .foot b { color: #4ade80; font-weight: 500; }
  .art { position: absolute; right: 60px; top: 95px; width: 400px; height: 440px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#4ade80" stroke-width="1.8"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="6" r="4"/><circle cx="6" cy="18" r="4"/><circle cx="18" cy="18" r="4"/></g><rect x="9" y="9" width="6" height="6" rx="1.5" fill="#e8eaed"/></svg>
      ShramkoGSFPV
    </div>
    <h1>Fly an FPV drone through <em>real 3D scans</em> — right in your browser</h1>
    <div class="foot"><span><b>●</b> open source · MIT · WebGPU · SuperSplat scans · no install</span></div>
  </div>
  <svg class="art" viewBox="0 0 400 440" aria-hidden="true">
    <!-- flight path through a voxel wall gap -->
    <g fill="none" stroke="rgba(232,234,237,.22)" stroke-width="1.5">
      <rect x="236" y="40" width="40" height="40"/><rect x="236" y="80" width="40" height="40"/><rect x="236" y="120" width="40" height="40"/>
      <rect x="236" y="280" width="40" height="40"/><rect x="236" y="320" width="40" height="40"/><rect x="236" y="360" width="40" height="40"/>
      <rect x="276" y="40" width="40" height="40"/><rect x="276" y="360" width="40" height="40"/>
    </g>
    <path d="M20 380 C 110 360, 150 250, 256 220 S 370 120, 392 70" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".9"/>
    <g transform="translate(150 262) rotate(-28)">
      <g fill="none" stroke="#4ade80" stroke-width="4"><circle cx="-34" cy="-34" r="24"/><circle cx="34" cy="-34" r="24"/><circle cx="-34" cy="34" r="24"/><circle cx="34" cy="34" r="24"/></g>
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="#e8eaed"/>
    </g>
  </svg>
</body>
</html>
