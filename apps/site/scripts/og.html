<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The landing's share card (public/og.jpg, 1200x630): a real frame from the simulator (the hero
     poster, a screen capture with its OSD) and the reasons FPV pilots try it, in the words the page
     uses. Rendered by scripts/og.mjs. -->
<style>
  @font-face { font-family: "Inter"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JBM"; src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #07080a; color: #e8eaed; font-family: "Inter", sans-serif; position: relative; }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 40%; }
  .veil { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(7,8,10,.94) 0%, rgba(7,8,10,.86) 38%, rgba(7,8,10,.35) 66%, rgba(7,8,10,0) 82%),
      linear-gradient(0deg, rgba(7,8,10,.85) 0%, rgba(7,8,10,0) 30%); }
  .content { position: absolute; left: 64px; top: 56px; width: 680px; bottom: 52px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
  h1 { margin: 40px 0 0; font-size: 60px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #4ade80; }
  .why { margin: 28px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 24px; color: #d6dae0; }
  .why li::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4ade80; margin-right: 14px; vertical-align: middle; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 22px; }
  .cta { background: #4ade80; color: #03170b; font-weight: 700; font-size: 26px; padding: 14px 28px; border-radius: 999px; }
  .host { font-family: "JBM", monospace; font-size: 22px; color: #9ba3ae; }
</style>
</head>
<body>
  <img class="shot" src="../public/media/hero-poster.jpg" alt="">
  <div class="veil"></div>
  <div class="content">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#4ade80" stroke-width="1.8"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="6" r="4"/><circle cx="6" cy="18" r="4"/><circle cx="18" cy="18" r="4"/></g><rect x="9" y="9" width="6" height="6" rx="1.5" fill="#e8eaed"/></svg>
      ShramkoGSFPV
    </div>
    <h1>Fly an FPV drone through <em>real 3D scans</em> — right in your browser</h1>
    <ul class="why">
      <li>Your own radio over USB, or touch sticks</li>
      <li>Betaflight-style rates and PID, real crashes</li>
      <li>Free and open source, nothing to install</li>
    </ul>
    <div class="foot"><span class="cta">Fly free now →</span><span class="host">gsfpv.flyreelstudio.eu</span></div>
  </div>
</body>
</html>
