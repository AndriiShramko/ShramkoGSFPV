# gsfpv.flyreelstudio.eu — static release (landing + /fly simulator) + /api proxy.
# Container nginx: after changing this file run `docker restart gsfpv-web` (scp replaces the
# inode, so a reload would not see it). add_header inside a location drops the server-level
# set, so every location repeats the full header block.

gzip on;
gzip_static on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/xml text/xml;

types {
    application/wasm wasm;
}

# language for "/": remembered choice (NEXT_LOCALE cookie) wins over the browser language
map $http_accept_language $gsfpv_browser_lang {
    default en;
    "~*^\s*es" es;
    "~*^\s*pl" pl;
    "~*^\s*(ru|uk|be)" ru;
}
map $cookie_NEXT_LOCALE $gsfpv_cookie_lang {
    default "";
    "~^(en|es|pl|ru)$" $1;
}
map "$gsfpv_cookie_lang:$gsfpv_browser_lang" $gsfpv_lang {
    default $gsfpv_browser_lang;
    "~^(?<c>en|es|pl|ru):" $c;
}

server {
    listen 80;
    server_name gsfpv.flyreelstudio.eu gsfpv-staging.flyreelstudio.eu;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        return 302 /$gsfpv_lang/;
    }

    location = /fly/ {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        return 302 /$gsfpv_lang/fly/$is_args$args;
    }

    # hashed build assets (Next and the Vite simulator): cache forever
    location ~ ^/(_next/static|fly/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # small data files that may change between releases
    location ~ ^/fly/(showcase\.json|presets/) {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # the simulator: same bundle under every locale
    location ~ ^/(en|es|pl|ru)/fly/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; connect-src 'self' https://d28zzqy0iyovbz.cloudfront.net https://s3-eu-west-1.amazonaws.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: blob: https://s3-eu-west-1.amazonaws.com https://d28zzqy0iyovbz.cloudfront.net https://www.googletagmanager.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /$1/fly/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; connect-src 'self' https://d28zzqy0iyovbz.cloudfront.net https://s3-eu-west-1.amazonaws.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: blob: https://s3-eu-west-1.amazonaws.com https://d28zzqy0iyovbz.cloudfront.net https://www.googletagmanager.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    location = /api/e {
        proxy_pass http://gsfpv-api:8090/api/e;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
    }
    location = /api/lead {
        proxy_pass http://gsfpv-api:8090/api/lead;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
    }
    location = /api/health {
        proxy_pass http://gsfpv-api:8090/api/health;
    }
}
