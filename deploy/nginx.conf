# gsfpv.flyreelstudio.eu — static release (landing + /fly simulator) + /api proxy.
# Container nginx. Changing this file: follow deploy/README.md ("Changing nginx.conf": upload,
# nginx -t, reload or restart, check) BEFORE the next deploy; deploy.sh refuses to switch while the
# hub's copy, or the copy gsfpv-web sees, differs from this one. A file replaced by a new inode is
# only seen after `docker restart gsfpv-web` (single-file bind mount).
# add_header inside a location drops the server-level set, so every location repeats the full
# header block.
# The enforced CSP takes each page's inline script hashes from csp-hashes.conf INSIDE the release,
# and nginx reads that map only when it loads its config: after every release switch nginx must
# be reloaded (deploy.sh and rollback.sh both run `nginx -t && nginx -s reload` in gsfpv-web),
# or the old hashes stay and the new pages' inline scripts are blocked.

gzip on;
gzip_static on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/xml text/xml;

# application/wasm is already in nginx's mime.types (a second `types` entry only produced a warning)

# long CSP hash lists as map values need bigger buckets; nginx fixes the size when it parses the
# FIRST map, so this line must stay above every map (below them it is "duplicate" and nginx -t fails)
map_hash_bucket_size 128;

# the owner bot's webhook (location ^~ /api/tg/ below): Telegram sends a few updates a minute at most.
# One bucket PER CLIENT: that location sets the real-IP module (as /api/admin/ does), whose PREACCESS
# handler runs before limit_req's, so $binary_remote_addr is the visitor behind nginx-proxy, not the
# proxy. A flood of POSTs to a guessed path then uses up only its sender's bucket, never the one of
# Telegram's servers (the API refuses wrong paths and secrets itself and limits per address too).
limit_req_zone $binary_remote_addr zone=gsfpv_tg:1m rate=60r/m;

# language for "/": remembered choice (NEXT_LOCALE cookie) wins over the browser language
map $http_accept_language $gsfpv_browser_lang {
    default en;
    "~*^\s*es" es;
    "~*^\s*pl" pl;
    "~*^\s*(ru|uk|be)" ru;
}
map $cookie_NEXT_LOCALE $gsfpv_cookie_lang {
    default "";
    "~^(en|es|pl|ru)$" $1;
}
map "$gsfpv_cookie_lang:$gsfpv_browser_lang" $gsfpv_lang {
    default $gsfpv_browser_lang;
    "~^(?<c>en|es|pl|ru):" $c;
}

# Content-Security-Policy. Next's static export puts inline <script> blocks in every page, so the
# enforced policy lists their sha256 per page (scripts/build-release.mjs writes the map body; every
# HTML page is listed, a page with no inline script maps to 'self'). The include is a glob so a
# release without the file (built before it existed) still loads: its pages map to "" and get only
# the Report-Only header, as before, instead of an enforced policy that would block their scripts.
# Exactly one of the two headers is sent (add_header skips an empty value).
map $uri $gsfpv_csp_hashes {
    default "";
    include /srv/releases/current/csp-hashes*.conf;
}
# everything after script-src, shared by both headers (a map with only a default = a constant)
map $uri $gsfpv_csp_rest {
    default "connect-src 'self' https://d28zzqy0iyovbz.cloudfront.net https://s3-eu-west-1.amazonaws.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: blob: https://s3-eu-west-1.amazonaws.com https://d28zzqy0iyovbz.cloudfront.net https://www.googletagmanager.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
}
map $gsfpv_csp_hashes $gsfpv_csp {
    "" "";
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com $gsfpv_csp_hashes; $gsfpv_csp_rest";
}
map $gsfpv_csp_hashes $gsfpv_csp_report_only {
    "" "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; $gsfpv_csp_rest";
    default "";
}

server {
    # Docker's embedded DNS: the API container is looked up per request (cached 10 s), so recreating
    # gsfpv-api never leaves nginx holding a dead address (a variable in proxy_pass forces this)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gsfpv-api:8090;

    listen 80;
    # relative Location headers (/pl/): behind nginx-proxy or a port mapping an absolute redirect
    # would name this container's own scheme and port (http, 80) instead of the visitor's
    absolute_redirect off;
    server_name gsfpv.flyreelstudio.eu gsfpv-staging.flyreelstudio.eu;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        return 302 /$gsfpv_lang/;
    }

    location = /fly/ {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        return 302 /$gsfpv_lang/fly/$is_args$args;
    }

    # hashed build assets (Next and the Vite simulator): cache forever
    location ~ ^/(_next/static|fly/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # small data files that may change between releases
    location ~ ^/fly/(showcase\.json|presets/) {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # the owner's admin page (apps/fly/admin, built into dist/admin/): never cached, never framed, not
    # indexed, its own strict CSP (no inline script; data only from /api/admin/ and /api/catalog, plus the
    # scene CDN and the posters for the add-a-scene check). Everything it shows comes from /api/admin/.
    location ^~ /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), hid=(), gamepad=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://d28zzqy0iyovbz.cloudfront.net; img-src 'self' data: https://s3-eu-west-1.amazonaws.com https://d28zzqy0iyovbz.cloudfront.net; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # the scene page templates the API reads from the release (apps/site/scripts/scene-templates.mjs): never
    # served as pages, a raw template is not for visitors or crawlers
    location ^~ /scene-templates/ {
        return 404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # the simulator: same bundle under every locale
    location ~ ^/(en|es|pl|ru)/fly/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy $gsfpv_csp always;
        add_header Content-Security-Policy-Report-Only $gsfpv_csp_report_only always;
        try_files $uri $uri/ /$1/fly/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "hid=(self), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy $gsfpv_csp always;
        add_header Content-Security-Policy-Report-Only $gsfpv_csp_report_only always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    location = /api/e {
        proxy_pass $api_upstream/api/e;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
    }
    location = /api/lead {
        proxy_pass $api_upstream/api/lead;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
    }
    # bug reports and ideas (the simulator and the landing): a bug with the visitor's consent carries its
    # diagnostics, the only large body the API takes (the API refuses more than 8 KB of words itself)
    location = /api/report {
        limit_except POST { deny all; }
        proxy_pass $api_upstream/api/report;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        client_max_body_size 512k;
    }
    # a picture of the view for a share link (JPEG 1200x630)
    location = /api/share {
        limit_except POST { deny all; }
        proxy_pass $api_upstream/api/share;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        client_max_body_size 512k;
    }
    # share links: /s/<id> (a page with Open Graph tags, its own CSP from the API) and /s/<id>.jpg
    # (og:image). Only these two shapes reach the API; everything else under /s/ is the static 404.
    location ~ "^/s/[A-Za-z0-9_-]{11}(\.jpg)?$" {
        limit_except GET { deny all; }
        proxy_pass $api_upstream$uri;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    # the published scene catalogue the picker reads (apps/api/admin.py): public, GET only; the API's ETag
    # and max-age=60 pass through. No cookies or credentials go on.
    location = /api/catalog {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/catalog;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
    }
    # the public roadmap from the ideas store (apps/api/ideas.py): GET only, the API's ETag and max-age=60
    # pass through; it carries only our own titles and texts, never a pilot's words or contact.
    location = /api/roadmap {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/roadmap;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
    }
    # the owner bot's webhook (apps/api/ownerbot.py): POST only, small bodies (Telegram's updates are a
    # few KB), rate-limited per client above (the real-IP lines are those of /api/admin/: the address
    # nginx-proxy appends, read from the right). The path's last part is derived from TG_WEBHOOK_SECRET
    # and the API also checks the X-Telegram-Bot-Api-Secret-Token header (passed on untouched); anything
    # wrong is 404/403 from the API. $uri: no query string reaches it.
    location ^~ /api/tg/ {
        limit_except POST { deny all; }
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        limit_req zone=gsfpv_tg burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass $api_upstream$uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # the owner's admin API (apps/api/admin.py): GET/POST only, 256 KB bodies, never cached. The login
    # lockout counts by client address: the real-IP module takes it from the X-Forwarded-For the hub's
    # front proxy (nginx-proxy, a private address) appends, read from the right, so an address a visitor
    # writes into the header himself is skipped; the API gets only that one address.
    location ^~ /api/admin/ {
        limit_except GET POST { deny all; }
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        client_max_body_size 256k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    # scene pages for search and answer engines (apps/api/scenepages.py, v0.7): /{lang}/scenes/ and
    # /{lang}/scenes/<id>/, rendered by the API from the published catalogue and the live release's templates.
    # The API sends their CSP (script-src 'none': the pages run no script), Cache-Control and ETag; GET/HEAD
    # only, no cookies or credentials go on, no query string either ($uri).
    location ~ "^/(en|es|pl|ru)/scenes/([0-9a-f]{6,32}/)?$" {
        limit_except GET { deny all; }
        proxy_pass $api_upstream$uri;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), hid=(), gamepad=()" always;
    }
    # the canonical scene URLs end in a slash: the bare forms are sent there (else they fall to `location /`,
    # whose try_files answers the static 404 page with a 200)
    location ~ "^/(en|es|pl|ru)/scenes$" {
        return 301 /$1/scenes/;
    }
    location ~ "^/(en|es|pl|ru)/scenes/([0-9a-f]{6,32})$" {
        return 301 /$1/scenes/$2/;
    }
    # the scene pages for crawlers (named in robots.txt) and answer engines (linked from llms.txt)
    location = /scenes/sitemap.xml {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/scenes/sitemap.xml;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /scenes/llms.txt {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/scenes/llms.txt;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
    }
    # the wind at a published scene's place now (apps/api/wind.py, Open-Meteo, cached 15 min): GET only, the
    # query string (?mode=now) as sent; 30 requests a minute per visitor in the API. The visitor is the address
    # the hub's front proxy appended (the real-IP module, as for /api/admin/): an X-Forwarded-For the visitor
    # writes himself never becomes a fresh key for the limit.
    location ~ "^/api/wind/[0-9a-f]{6,32}$" {
        limit_except GET { deny all; }
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /api/health {
        proxy_pass $api_upstream/api/health;
    }
    # SuperSplat catalogue (docs/decisions.md D35): the API asks PlayCanvas' explore list for the
    # visitor, whose browser may not (their CORS answers only superspl.at). GET only; the visitor's
    # cookies and credentials stop here. $request_uri keeps the query string exactly as sent, and the
    # API refuses everything off its whitelist.
    location ^~ /api/superspl/ {
        limit_except GET { deny all; }
        proxy_pass $api_upstream$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
