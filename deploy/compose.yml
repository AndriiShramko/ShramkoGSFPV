# ShramkoGSFPV on the hub, in its own directory (GSFPV_BASE in deploy/hub.env).
# Three containers, no host ports: nginx:alpine serves the static release behind nginx-proxy + acme,
# a tiny python API counts events and forwards leads, gsfpv-rooms holds the rooms' WebSockets
# (docs/rooms-protocol.md). The web-proxy network is external: never
# created or changed from here. Neighbours are never touched.
name: gsfpv

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gsfpv-web:
    image: nginx:1.29-alpine
    container_name: gsfpv-web
    restart: unless-stopped
    volumes:
      - ./releases:/srv/releases:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: gsfpv.flyreelstudio.eu
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: gsfpv.flyreelstudio.eu
      LETSENCRYPT_EMAIL: zmei116@gmail.com
    networks: [web-proxy, gsfpv-internal]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  gsfpv-api:
    image: python:3.12-alpine
    container_name: gsfpv-api
    restart: unless-stopped
    command: ["python", "-u", "/app/server.py"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - ./api:/app:ro
      - ./data:/data
      # the scene page templates of the live release (scenepages.py reads releases/current/scene-templates/)
      - ./releases:/srv/releases:ro
    env_file: [config.env]
    environment:
      DATA_DIR: /data
      PORT: "8090"
      SITE_TAG: gsfpv
    networks: [gsfpv-internal]
    # 192m, not 64m (v0.12, docs/wip/v12-plan.md section 8): the recordings' delivery streams every package from disk, so its own peak is under
    # 1 MiB (tests/test_session_delivery.py measures it), but a mail attachment of up to 15 MiB is a message of about 20 MiB that Gmail takes in one go,
    # and the owner chose the room over the risk. Compose applies a changed limit only when the container is recreated (--force-recreate).
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 32
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Rooms (lane rooms, docs/rooms-protocol.md, rooms-plan.md 2.1): pilots who fly one scan together. One asyncio
  # process holds every room socket in one thread (gsfpv-api is a thread per connection with pids_limit 32).
  # Rooms live in RAM in train 1: no data volume. Reached only through our nginx (/api/rooms, /api/rooms/ws).
  # Limits are the plan's; the load run (evidence/<date>/rooms-load.json) measured the process on a PC, not in them.
  gsfpv-rooms:
    image: python:3.12-alpine
    container_name: gsfpv-rooms
    restart: unless-stopped
    command: ["python", "-u", "/app/rooms.py"]
    read_only: true
    volumes:
      - ./rooms:/app:ro
    environment:
      PORT: "8091"
      PYTHONDONTWRITEBYTECODE: "1"
    networks: [gsfpv-internal]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 8
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  web-proxy:
    external: true
  gsfpv-internal:
    driver: bridge
